:root{--bg:#141010;--surface:#1e1a19;--ink:#f6f2f1;--mute:#b3aaa8;--ok:#7ad99a;--ok-bg:#16301f;--line:#342d2b;--chuo:#d9142c;--chuo-ink:#ff6b7d;--chuo-soft:#2b1519;--stay:#272120;--stay-ink:#e7dedc;--warn:#ffb454;--warn-bg:#33250f;color-scheme:dark;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:720px;margin:0 auto;padding-block:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--mute);font:500 14px var(--sans);padding:6px 12px;border-radius:6px;cursor:pointer;text-align:center;line-height:1.3}
.tab b{display:block;font:500 15px var(--mono);color:inherit}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--chuo);color:#fff}
.tab.ref{border:1px dashed var(--line)}
.tab.ref[aria-selected=true]{border-color:var(--chuo)}
.tab:focus-visible{outline:2px solid var(--chuo);outline-offset:2px}
.sep{flex:none;width:1px;background:var(--line);margin:4px 6px}
main{padding-top:20px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dayhead h2{margin:0;font-size:22px}
.cost{font:500 13px var(--mono);color:var(--mute)}
ol{list-style:none;margin:0;padding:0;position:relative}
ol::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
li{position:relative;padding:0 0 14px 32px;min-width:0}
li::before{content:"";box-sizing:border-box;position:absolute;left:2px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--mute)}
li.move::before{border-color:var(--chuo);background:var(--chuo)}
li.stay::before{border-color:var(--stay-ink);background:var(--stay-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:0}
.move .card{border-color:var(--chuo);background:var(--chuo-soft)}
.stay .card{background:var(--stay);border-color:transparent;color:var(--stay-ink)}
.row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.name{font-weight:700;overflow-wrap:anywhere;min-width:0}
.hours,.t,.yen{font:400 13px var(--mono);color:var(--mute);white-space:nowrap}
.yen{color:var(--ink)}
.stay .hours,.stay .yen{color:inherit}
.via{display:inline-block;font:500 12px var(--sans);background:var(--chuo);color:#fff;border-radius:4px;padding:0 7px;margin-right:6px}
.note{margin:2px 0 0;font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.move .note{color:var(--ink)}
.stay .note{color:inherit}
.t{color:var(--chuo-ink);margin-right:6px}
.via.off{background:var(--line);color:var(--ink)}
.total{margin-top:8px;padding:6px 14px;border-radius:8px;border:1px dashed var(--line);font-size:14px;color:var(--mute)}
.total div{display:flex;justify-content:space-between;padding:6px 0}
.total .sum{border-top:1px solid var(--line);margin-top:2px;color:var(--ink)}
.total b{font:500 15px var(--mono);color:var(--ink)}
a.map{color:inherit;text-decoration:none}
a.map::after{content:" ↗";font-size:.8em;color:var(--chuo-ink)}
a.map:hover{color:var(--chuo-ink)}
a.map:focus-visible{outline:2px solid var(--chuo);outline-offset:2px}
.pill{display:inline-block;font:500 12px var(--sans);border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.today{background:var(--chuo);color:#fff}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.closed .name a,.closed .name{color:var(--mute);font-weight:400}
.closed .note.w{color:var(--warn);font-weight:500}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:middle}
.tab[aria-selected=true] .dot{background:#fff}
.tab.today b::before{content:"今 ";font:500 11px var(--sans)}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chk{flex:none;width:18px;height:18px;margin:0 8px 0 0;vertical-align:-3px;touch-action:manipulation;accent-color:var(--chuo);cursor:pointer}
.done .card{opacity:.6}
.done .name a.map,.done .nm{text-decoration:line-through;text-decoration-color:var(--mute)}
.pill.prog{background:var(--chuo-soft);color:var(--chuo);font-family:var(--mono)}

.refgrid .card{display:flex;flex-direction:column}

function expHtml(){
  var tot=0,cash=0,card=0,sui=0;EXP.forEach(function(x){if(x.m==='suica'){sui+=x.amt;return}tot+=x.amt;if(x.m==='card')card+=x.amt;else cash+=x.amt});
  var h='<div class="dayhead"><div class="pills"><h2>記帳</h2></div><span class="rt"><span class="cost">日圓 JPY</span><button type="button" class="tg" id="cpx">複製紀錄</button></span></div>';
  h+='<div class="sum3"><div><span>合計</span><b>'+yen(tot)+'</b></div><div><span>現金</span><b>'+yen(cash)+'</b></div><div><span>信用卡</span><b>'+yen(card)+'</b></div><div><span>Suica</span><b>'+yen(sui)+'</b></div></div>';
  h+='<div class="bar xb"><button type="button" class="tg addx" data-c="交通卡儲值">＋ 交通卡儲值</button><button type="button" class="tg addx" data-c="餐費">＋ 餐費</button><button type="button" class="tg addx" data-c="咖啡甜點">＋ 咖啡甜點</button><button type="button" class="tg addx" data-c="超商">＋ 超商</button><button type="button" class="tg addx" data-c="購物">＋ 購物</button><button type="button" class="tg addx" data-c="">＋ 其他花費</button></div>';
  if(!EXP.length){return h+'<p class="empty">還沒有紀錄。點店家卡片右邊的 ¥ 開始記帳，臨時的花費按「其他花費」。</p>'}
  var days=[];EXP.forEach(function(x){if(days.indexOf(x.day)<0)days.push(x.day)});
  days.sort(function(a,b){return a===''?1:b===''?-1:a<b?-1:a>b?1:0});
  days.forEach(function(dk){
    var list=EXP.filter(function(x){return x.day===dk}).sort(function(a,b){return a.t-b.t}),sub=0;
    list.forEach(function(x){if(x.m!=='suica')sub+=x.amt});
    h+='<h3 class="reg">'+esc(dayLabel(dk))+'<span>'+yen(sub)+'</span></h3>';
    list.forEach(function(x){
      h+='<button type="button" class="xr" data-id="'+esc(x.id)+'"><span>'+esc(x.shop||x.cat||'其他花費')+'<small>'+tfmt(x.t)+(x.note?'　'+esc(x.note):'')+'</small></span><span><b>'+yen(x.amt)+'</b><span class="via">'+MTX[x.m]+'</span></span></button>';
    });
  });
  return h+'<p class="fn">Suica 付款只單獨記錄，不計入合計、現金和信用卡。紀錄只存在這支手機的瀏覽器裡，清除網站資料就會消失。建議不定時按「複製紀錄」備份。</p>';
}
function copyExp(btn){
  var rows=['日期,記錄時間,店家,金額,付款方式,備註'];
  EXP.slice().sort(function(a,b){return a.t-b.t}).forEach(function(x){
    rows.push([x.day,tfmt(x.t),x.shop||x.cat||'其他花費',x.amt,MTX[x.m],x.note].map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(','));
  });
  var txt=rows.join('\n'),done=function(){btn.textContent='已複製';setTimeout(function(){btn.textContent='複製紀錄'},1500)};
  function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb();
}
function qpRemove(li){var q=li.querySelector('.qp');if(q)q.remove();if(HIDE&&li.querySelector('.chk:checked'))li.classList.add('gone')}
function qpAdd(li,name){
  var q=document.createElement('div');q.className='qp';
  q.innerHTML='記一筆？<button type="button" data-m="cash">現金</button><button type="button" data-m="card">信用卡</button><button type="button" data-m="suica">Suica</button>';
  q.setAttribute('data-n',encodeURIComponent(name));li.appendChild(q);
  setTimeout(function(){if(q.parentNode)qpRemove(li)},6000);
}
function itemHtml(it,wd,tid){
  var ck=it.name.indexOf('宿泊')!==0,key=tid+'|'+it.name,done=ck&&!!DONE[key];
  var closed=!!wd&&!it.via&&closedOn(it.note,wd);
  var cls=(it.name.indexOf('宿泊')===0?'stay':(it.via?'move':''))+(closed?' closed':'')+(done?' done':'');
  var h='<li class="'+cls+(done&&HIDE?' gone':'')+'"><div class="card"><div class="row1"><span class="name">'+(ck?'<input type="checkbox" class="chk" data-k="'+encodeURIComponent(key)+'"'+(done?' checked':'')+' aria-label="已去過">':'')+(it.time?'<span class="t">'+esc(it.time)+'</span>':'')+(closed?'<span class="via off">公休</span>':'')+(it.via?'<span class="via">'+esc(it.via)+'</span>':'')+(it.url&&/^https:\/\//.test(it.url)?'<a class="map" target="_blank" rel="noopener" href="'+esc(it.url)+'">'+esc(it.name)+'</a>':'<span class="nm">'+esc(it.name)+'</span>')+(ck&&!it.via?expBtn(it.name):'')+'</span>';
  var r=[];if(it.hours)r.push('<span class="hours">'+esc(it.hours)+'</span>');
  if(it.jpy&&it.jpy!=='－')r.push('<span class="yen">¥'+esc(it.jpy)+'</span>');
  if(it.ntd)r.push('<span class="yen">NT$'+esc(it.ntd)+'</span>');
  h+='<span class="row1" style="gap:12px">'+r.join('')+'</span></div>';
  if(it.note)h+='<p class="note">'+(it.noteUrl&&/^https:\/\//.test(it.noteUrl)?'<a class="map" target="_blank" rel="noopener" href="'+esc(it.noteUrl)+'">'+esc(it.note)+'</a>':esc(it.note))+'</p>';
  return h+'</div></li>';
}
D.days.forEach(function(d,i){
  var m=d.date.match(/^(\d+\/\d+)(.*)$/);
  var wd0=(m[2].match(/（(.)）/)||[])[1],bad=d.items.filter(function(it){return !it.via&&closedOn(it.note,wd0)}).length;
  var key=m[1].replace(/^(\d)\//,'0$1/').replace(/\/(\d)$/,'/0$1');
  ids.push({id:'day'+(i+1),label:'<b>'+m[1]+'</b>'+m[2].replace(/[（）]/g,''),d:d,type:'day',wd:wd0,bad:bad,key:key});
});
D.refs.forEach(function(r,i){ids.push({id:'ref'+(i+1),label:r.title,d:r,type:'ref'})});
ids.push({id:'exp',label:'記帳',type:'exp'});
ids.forEach(function(t,i){
  if((t.type==='ref'&&ids[i-1].type==='day')||t.type==='exp'){var s=document.createElement('span');s.className='sep';tabs.appendChild(s)}
  var b=document.createElement('button');b.className='tab'+(t.type!=='day'?' ref':'')+(t.key&&t.key===todayKey?' today':'');b.id='tab-'+t.id;b.setAttribute('role','tab');b.innerHTML=t.label;
  b.onclick=function(){location.hash=t.id};tabs.appendChild(b);
});
function show(auto){
  var id=location.hash.slice(1),t=ids.filter(function(x){return x.id===id})[0]||ids.filter(function(x){return x.key&&x.key===todayKey})[0]||ids[0];
  ids.forEach(function(x){document.getElementById('tab-'+x.id).setAttribute('aria-selected',x===t)});
  var b=document.getElementById('tab-'+t.id);
  tabs.scrollTo({left:b.getBoundingClientRect().left-tabs.getBoundingClientRect().left+tabs.scrollLeft-(tabs.clientWidth-b.offsetWidth)/2,behavior:'smooth'});
  var d=t.d,h='';J=jst();NOWMIN=(+J.hour)*60+(+J.minute);LIVE=t.type==='day'&&t.key===todayKey;CURDAY=t.type==='day'?t.key:todayKey;
  if(t.type==='day'){
    var cost=0;d.items.forEach(function(it){if(it.name.indexOf('宿泊')!==0)cost+=num(it.jpy)});
    h+='<div class="dayhead"><div class="pills"><h2>'+esc(d.date)+'</h2>'+(t.key===todayKey?'<span class="pill today">今天</span>':'')+'</div><span class="rt">'+(cost?'<span class="cost">交通與門票 ¥'+cost.toLocaleString()+'</span>':'')+tgBtn()+'</span></div>'+bar(false)+'<ol>'+d.items.map(function(it){return itemHtml(it,t.wd,t.id)}).join('')+'</ol>';
    if(t===ids[D.days.length-1]){
      var stay=0,other=0;D.days.forEach(function(x){x.items.forEach(function(it){if(it.name.indexOf('宿泊')===0)stay+=num(it.jpy);else other+=num(it.jpy)})});
      h+='<div class="total"><div><span>住宿</span><b>¥'+stay.toLocaleString()+'</b></div><div><span>交通與門票</span><b>¥'+other.toLocaleString()+'</b></div><div class="sum"><span>整趟旅程 JPY 總計</span><b>¥'+esc(D.total)+'</b></div></div>';
    }
  }else if(t.type==='ref'){
    h+='<div class="dayhead"><div class="pills"><h2>'+esc(d.title)+'</h2></div><span class="cost">備選清單 · '+d.items.length+' 項</span></div>';
    h+=bar(true)+'<ol>'+d.items.filter(function(it){var w=refWd();return !(w&&!it.via&&closedOn(it.note,w))}).map(function(it){return itemHtml(it,null,t.id)}).join('')+'</ol>';
  }else{h+=expHtml()}
  view.innerHTML=h;
  prog();
  var sc=false;
  if(auto&&LIVE&&view.querySelector('.chk:checked')){var f=view.querySelector('li:not(.gone) .chk:not(:checked)'),li0=f&&f.closest('li');if(li0){li0.scrollIntoView();sc=true}}
  return sc;
}
function prog(){
  var p=document.getElementById('prog');if(!p)return;
  var all=view.querySelectorAll('.chk'),on=view.querySelectorAll('.chk:checked');
  p.textContent=all.length?'已去 '+on.length+'/'+all.length:'';p.hidden=!all.length;
}
view.addEventListener('change',function(e){
  var c=e.target;if(!c.classList||!c.classList.contains('chk'))return;
  var k=decodeURIComponent(c.getAttribute('data-k'));
  if(c.checked)DONE[k]=1;else delete DONE[k];
  saveDone();var li=c.closest('li');li.classList.toggle('done',c.checked);prog();
  var nm=k.slice(k.indexOf('|')+1),pr=false,oq=li.querySelector('.qp');
  if(oq)oq.remove();
  if(c.checked&&!li.classList.contains('move')&&shopTotal(nm)===0){qpAdd(li,nm);pr=true}
  if(HIDE){if(c.checked){if(!pr)setTimeout(function(){if(c.checked)li.classList.add('gone')},800)}else li.classList.remove('gone')}
});
window.addEventListener('hashchange',function(){if(!show(true))window.scrollTo(0,0)});
show(true);
view.addEventListener('click',function(e){
  var qb=e.target.closest('.qp button');if(qb){var q=qb.parentNode,qli=q.closest('li');openSheet({shop:decodeURIComponent(q.getAttribute('data-n')),day:CURDAY,m:qb.getAttribute('data-m')});qpRemove(qli);return}
  var eb=e.target.closest('.eb');if(eb){var sn=decodeURIComponent(eb.getAttribute('data-s')),last=EXP.filter(function(x){return x.shop===sn}).sort(function(a,b){return b.t-a.t})[0];openSheet(last?{id:last.id}:{shop:sn,day:CURDAY});return}
  var xr=e.target.closest('.xr');if(xr){openSheet({id:xr.getAttribute('data-id')});return}
  var ax=e.target.closest('.addx');if(ax){openSheet({shop:'',cat:ax.getAttribute('data-c')||'',day:todayKey});return}
  if(e.target.closest('#cpx')){copyExp(e.target.closest('#cpx'));return}
  if(e.target.closest('.tg')){HIDE=!HIDE;try{localStorage.setItem('hide2612',HIDE?'1':'0')}catch(x){}show(false);return}
});
view.addEventListener('change',function(e){var s=e.target;if(!s.classList||!s.classList.contains('ds'))return;REFDAY=s.value;try{localStorage.setItem('refday2612',REFDAY)}catch(x){}show(false)});
view.addEventListener('input',function(e){var s=e.target;if(!s.classList||!s.classList.contains('sr'))return;var q=s.value.trim().toLowerCase();view.querySelectorAll('li').forEach(function(li){li.classList.toggle('nf',!!q&&li.textContent.toLowerCase().indexOf(q)<0)})});
tabs.addEventListener('scroll',fade);window.addEventListener('resize',fade);window.addEventListener('load',fade);fade();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
